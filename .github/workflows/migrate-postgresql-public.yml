name: Cut over to public PostgreSQL

on:
  push:
    branches:
      - producao
    paths:
      - Dockerfile
      - .github/workflows/migrate-postgresql-public.yml
  workflow_dispatch:
    inputs:
      allowed_ip:
        description: Public IPv4 address allowed to connect with DBeaver
        required: true
        default: 45.178.251.100
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cutover-public-postgresql
  cancel-in-progress: true

jobs:
  cutover-lojatech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESOURCE_GROUP: rg-lojatech-prod
      NEW_SERVER: psql-apps-marcos-prod
      ADMIN_USER: appsadmin
      VNET_NAME: rg-lojatech-prod-vnet
      PRIVATE_ENDPOINT_SUBNET: snet-private-endpoints
      PRIVATE_DNS_ZONE: privatelink.postgres.database.azure.com

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOJATECHSTORE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOJATECHSTORE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOJATECHSTORE_AZURE_SUBSCRIPTION_ID }}

      - name: Configure server, firewall and empty databases
        if: ${{ false }}
        env:
          ALLOWED_IP: ${{ inputs.allowed_ip || '45.178.251.100' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Configure PostgreSQL failed::Command: $BASH_COMMAND (line $LINENO)"' ERR

          old_url="$(az containerapp secret list \
            --name lojatech-store \
            --resource-group "$RESOURCE_GROUP" \
            --show-values \
            --query "[?name=='database-url'].value | [0]" \
            --output tsv)"
          echo "::add-mask::$old_url"

          readarray -t password_parts < <(OLD_URL="$old_url" python3 - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlsplit

          password = unquote(urlsplit(os.environ["OLD_URL"]).password or "")
          print(password)
          print(quote(password, safe=""))
          PY
          )
          raw_password="${password_parts[0]}"
          encoded_password="${password_parts[1]}"
          echo "::add-mask::$raw_password"
          echo "::add-mask::$encoded_password"

          az postgres flexible-server firewall-rule delete \
            --server-name "$NEW_SERVER" \
            --resource-group "$RESOURCE_GROUP" \
            --name dbeaver-home \
            --yes \
            >/dev/null 2>&1 || true
          az postgres flexible-server firewall-rule create \
            --server-name "$NEW_SERVER" \
            --resource-group "$RESOURCE_GROUP" \
            --name dbeaver-home \
            --start-ip-address "$ALLOWED_IP" \
            --end-ip-address "$ALLOWED_IP" \
            >/dev/null

          for database in lojatech checklists_prod; do
            if ! az postgres flexible-server db show \
              --server-name "$NEW_SERVER" \
              --resource-group "$RESOURCE_GROUP" \
              --name "$database" \
              >/dev/null 2>&1; then
              az postgres flexible-server db create \
                --server-name "$NEW_SERVER" \
                --resource-group "$RESOURCE_GROUP" \
                --name "$database" \
                --charset UTF8 \
                --collation en_US.utf8 \
                >/dev/null
            fi
          done

          new_url="postgresql://${ADMIN_USER}:${encoded_password}@${NEW_SERVER}.postgres.database.azure.com:5432/lojatech?sslmode=require"
          echo "::add-mask::$new_url"
          az containerapp secret set \
            --name lojatech-store \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "database-url=$new_url" \
            >/dev/null

      - name: Create private endpoint for Container Apps
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Private endpoint failed::Command: $BASH_COMMAND (line $LINENO)"' ERR

          if ! az network vnet subnet show \
            --resource-group "$RESOURCE_GROUP" \
            --vnet-name "$VNET_NAME" \
            --name "$PRIVATE_ENDPOINT_SUBNET" \
            >/dev/null 2>&1; then
            az network vnet subnet create \
              --resource-group "$RESOURCE_GROUP" \
              --vnet-name "$VNET_NAME" \
              --name "$PRIVATE_ENDPOINT_SUBNET" \
              --address-prefixes 10.2.0.32/27 \
              --disable-private-endpoint-network-policies true \
              >/dev/null
          fi

          if ! az network private-dns zone show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PRIVATE_DNS_ZONE" \
            >/dev/null 2>&1; then
            az network private-dns zone create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$PRIVATE_DNS_ZONE" \
              >/dev/null
          fi

          if ! az network private-dns link vnet show \
            --resource-group "$RESOURCE_GROUP" \
            --zone-name "$PRIVATE_DNS_ZONE" \
            --name apps-vnet-link \
            >/dev/null 2>&1; then
            az network private-dns link vnet create \
              --resource-group "$RESOURCE_GROUP" \
              --zone-name "$PRIVATE_DNS_ZONE" \
              --name apps-vnet-link \
              --virtual-network "$VNET_NAME" \
              --registration-enabled false \
              >/dev/null
          fi

          if ! az network private-endpoint show \
            --name pe-psql-apps-marcos-prod \
            --resource-group "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then
            server_id="$(az postgres flexible-server show \
              --name "$NEW_SERVER" \
              --resource-group "$RESOURCE_GROUP" \
              --query id \
              --output tsv)"

            az network private-endpoint create \
              --name pe-psql-apps-marcos-prod \
              --resource-group "$RESOURCE_GROUP" \
              --location canadacentral \
              --vnet-name "$VNET_NAME" \
              --subnet "$PRIVATE_ENDPOINT_SUBNET" \
              --private-connection-resource-id "$server_id" \
              --group-id postgresqlServer \
              --connection-name pe-psql-apps-marcos-prod-connection \
              >/dev/null
          fi

          if ! az network private-endpoint dns-zone-group show \
            --resource-group "$RESOURCE_GROUP" \
            --endpoint-name pe-psql-apps-marcos-prod \
            --name postgres-zone-group \
            >/dev/null 2>&1; then
            zone_id="$(az network private-dns zone show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$PRIVATE_DNS_ZONE" \
              --query id \
              --output tsv)"

            az network private-endpoint dns-zone-group create \
              --resource-group "$RESOURCE_GROUP" \
              --endpoint-name pe-psql-apps-marcos-prod \
              --name postgres-zone-group \
              --private-dns-zone "$zone_id" \
              --zone-name postgres \
              >/dev/null
          fi

      - name: Delete old PostgreSQL server
        shell: bash
        run: |
          set -euo pipefail
          if az postgres flexible-server show \
            --name psql-lojatech-prod \
            --resource-group "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then
            az postgres flexible-server delete \
              --name psql-lojatech-prod \
              --resource-group "$RESOURCE_GROUP" \
              --yes
          fi

      - name: Restart LojaTech with the new empty database
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=LojaTech restart failed::Command: $BASH_COMMAND (line $LINENO)"' ERR
          az extension add --name containerapp --upgrade --allow-preview true

          revision_suffix="db-$(date +%s)"
          az containerapp update \
            --name lojatech-store \
            --resource-group "$RESOURCE_GROUP" \
            --revision-suffix "$revision_suffix" \
            --no-wait \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "IMPORT_LEGACY_SQLITE=false" \
              "DATABASE_CUTOVER_ID=$revision_suffix" \
            >/dev/null

          fqdn="$(az containerapp show \
            --name lojatech-store \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          latest_revision="lojatech-store--$revision_suffix"

          for attempt in $(seq 1 24); do
            if ! az containerapp revision show \
              --name lojatech-store \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$latest_revision" \
              >/dev/null 2>&1; then
              echo "Waiting for revision $latest_revision to be created."
              sleep 5
              continue
            fi

            state="$(az containerapp revision show \
              --name lojatech-store \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$latest_revision" \
              --query "[properties.healthState,properties.runningState,properties.provisioningState]" \
              --output tsv)"
            echo "Revision $latest_revision: $state"

            running="$(echo "$state" | cut -f2)"
            provisioning="$(echo "$state" | cut -f3)"
            if [ "$running" = "Failed" ] || [ "$provisioning" = "Failed" ]; then
              break
            fi

            if curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "https://$fqdn/" >/dev/null; then
              echo "LojaTech is healthy on the new PostgreSQL server."
              exit 0
            fi
            sleep 10
          done

          console_logs="$(timeout 30s az containerapp logs show \
            --name lojatech-store \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --type console \
            --tail 100 2>&1 || true)"
          echo "$console_logs"
          escaped_logs="${console_logs//'%'/'%25'}"
          escaped_logs="${escaped_logs//$'\r'/'%0D'}"
          escaped_logs="${escaped_logs//$'\n'/'%0A'}"
          echo "::error title=LojaTech container logs::$escaped_logs"
          echo "::error title=LojaTech cutover failed::The application did not become healthy."
          exit 1

      - name: Report connection target
        if: always()
        shell: bash
        run: |
          state="$(az postgres flexible-server show \
            --name "$NEW_SERVER" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{fqdn:fullyQualifiedDomainName,state:state,publicAccess:network.publicNetworkAccess,sku:sku.name}" \
            --output json 2>&1 || true)"
          state="${state//'%'/'%25'}"
          state="${state//$'\r'/'%0D'}"
          state="${state//$'\n'/'%0A'}"
          echo "::notice title=DBeaver PostgreSQL::$state"

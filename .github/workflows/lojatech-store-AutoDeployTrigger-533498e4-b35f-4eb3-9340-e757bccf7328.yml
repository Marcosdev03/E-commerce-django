name: Trigger auto deployment for lojatech-store

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ producao ]
    paths:
    - '**'
    - '.github/workflows/lojatech-store-AutoDeployTrigger-533498e4-b35f-4eb3-9340-e757bccf7328.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOJATECHSTORE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOJATECHSTORE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOJATECHSTORE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: acrlojatechprod-a8b7ctgnajcveccq.azurecr.io
          registryUsername: ${{ secrets.LOJATECHSTORE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOJATECHSTORE_REGISTRY_PASSWORD }}
          containerAppName: lojatech-store
          resourceGroup: rg-lojatech-prod
          imageToBuild: acrlojatechprod-a8b7ctgnajcveccq.azurecr.io/lojatech-store:${{ github.sha }}

      - name: Inspect revision startup
        if: always()
        run: |
          revisions="$(az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,replicas:properties.replicas,traffic:properties.trafficWeight}" \
            --output json)"

          latest_revision="$(az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "sort_by(@, &properties.createdTime)[-1].name" \
            --output tsv)"

          system_logs="$(az containerapp logs show \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision "$latest_revision" \
            --type system \
            --tail 100 2>&1 || true)"

          console_logs="$(az containerapp logs show \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision "$latest_revision" \
            --type console \
            --tail 100 2>&1 || true)"

          {
            echo "## Azure Container Apps"
            echo
            echo "Latest revision: \`$latest_revision\`"
            echo
            echo "### Revisions"
            echo '```json'
            echo "$revisions"
            echo '```'
            echo
            echo "### System logs"
            echo '```text'
            echo "$system_logs"
            echo '```'
            echo
            echo "### Console logs"
            echo '```text'
            echo "$console_logs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

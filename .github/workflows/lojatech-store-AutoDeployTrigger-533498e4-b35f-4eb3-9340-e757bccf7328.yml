name: Trigger auto deployment for lojatech-store

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ producao ]
    paths:
    - 'Dockerfile'
    - 'entrypoint.sh'
    - 'requirements.txt'
    - 'manage.py'
    - 'loja/**'
    - 'pedido/**'
    - 'perfil/**'
    - 'produto/**'
    - 'endereco/**'
    - 'carrinho_de_compras/**'
    - 'templates/**'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOJATECHSTORE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOJATECHSTORE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOJATECHSTORE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: acrlojatechprod-a8b7ctgnajcveccq.azurecr.io
          registryUsername: ${{ secrets.LOJATECHSTORE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOJATECHSTORE_REGISTRY_PASSWORD }}
          containerAppName: lojatech-store
          resourceGroup: rg-lojatech-prod
          imageToBuild: acrlojatechprod-a8b7ctgnajcveccq.azurecr.io/lojatech-store:${{ github.sha }}

      - name: Route traffic to the healthy latest revision
        run: |
          latest_revision="$(az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "sort_by(@, &properties.createdTime)[-1].name" \
            --output tsv)"

          for attempt in $(seq 1 30); do
            state="$(az containerapp revision show \
              --name lojatech-store \
              --resource-group rg-lojatech-prod \
              --revision "$latest_revision" \
              --query "[properties.healthState,properties.runningState,properties.provisioningState,properties.provisioningError]" \
              --output tsv)"

            echo "Revision $latest_revision: $state"
            health="$(echo "$state" | cut -f1)"
            running="$(echo "$state" | cut -f2)"
            provisioning="$(echo "$state" | cut -f3)"

            if [ "$health" = "Healthy" ] && [ "$running" = "Running" ]; then
              az containerapp ingress traffic set \
                --name lojatech-store \
                --resource-group rg-lojatech-prod \
                --revision-weight latest=100
              break
            fi

            if [ "$running" = "Failed" ] || [ "$provisioning" = "Failed" ]; then
              echo "::error title=Azure revision failed::$state"
              exit 1
            fi

            if [ "$attempt" = "30" ]; then
              echo "::error title=Azure revision timeout::$state"
              exit 1
            fi

            sleep 10
          done

          app_url="https://$(az containerapp show \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query properties.configuration.ingress.fqdn \
            --output tsv)/"

          for attempt in $(seq 1 12); do
            page="$(curl --fail --silent --show-error "$app_url" || true)"
            if echo "$page" | grep --quiet "Camiseta Supernatural"; then
              echo "Catálogo legado validado em $app_url"
              exit 0
            fi
            sleep 5
          done

          echo "::error title=Legacy data validation::Os produtos importados não apareceram em $app_url"
          exit 1

      - name: Inspect revision startup
        if: always()
        run: |
          escape_annotation() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '%s' "$value"
          }

          revisions="$(az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,replicas:properties.replicas,traffic:properties.trafficWeight}" \
            --output json)"

          latest_revision="$(az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "sort_by(@, &properties.createdTime)[-1].name" \
            --output tsv)"

          system_logs="$(timeout 30s az containerapp logs show \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision "$latest_revision" \
            --type system \
            --tail 100 2>&1 || true)"

          console_logs="$(timeout 30s az containerapp logs show \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision "$latest_revision" \
            --type console \
            --tail 100 2>&1 || true)"

          latest_state="$(az containerapp revision show \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision "$latest_revision" \
            --query "{name:name,health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,error:properties.provisioningError}" \
            --output json)"

          echo "::notice title=Latest Azure revision::$(escape_annotation "$latest_state")"
          echo "::warning title=Container console::$(escape_annotation "$(echo "$console_logs" | tail -n 30)")"

          {
            echo "## Azure Container Apps"
            echo
            echo "Latest revision: \`$latest_revision\`"
            echo
            echo "### Revisions"
            echo '```json'
            echo "$revisions"
            echo '```'
            echo
            echo "### System logs"
            echo '```text'
            echo "$system_logs"
            echo '```'
            echo
            echo "### Console logs"
            echo '```text'
            echo "$console_logs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

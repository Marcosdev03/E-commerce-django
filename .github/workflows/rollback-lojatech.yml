name: Rollback LojaTech traffic

on:
  push:
    branches: [ producao ]
    paths:
      - '.github/workflows/rollback-lojatech.yml'
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOJATECHSTORE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOJATECHSTORE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOJATECHSTORE_AZURE_SUBSCRIPTION_ID }}

      - name: Route traffic back to known healthy revision
        run: |
          set -euo pipefail

          az containerapp revision set-mode \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --mode multiple

          target_revision="$(az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "[?properties.healthState == 'Healthy' && properties.runningState == 'Running'] | sort_by(@, &properties.createdTime)[-1].name" \
            --output tsv)"

          if [ -z "$target_revision" ]; then
            echo "::error title=No healthy revision::Nenhuma revisao Healthy/Running encontrada."
            az containerapp revision list \
              --name lojatech-store \
              --resource-group rg-lojatech-prod \
              --query "[].{name:name,health:properties.healthState,running:properties.runningState,traffic:properties.trafficWeight,active:properties.active}" \
              --output table
            exit 1
          fi

          echo "Routing traffic to healthy revision: $target_revision"

          az containerapp revision activate \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision "$target_revision" || true

          az containerapp ingress traffic set \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --revision-weight "$target_revision=100"

          az containerapp revision list \
            --name lojatech-store \
            --resource-group rg-lojatech-prod \
            --query "[].{name:name,health:properties.healthState,running:properties.runningState,traffic:properties.trafficWeight,active:properties.active}" \
            --output table
